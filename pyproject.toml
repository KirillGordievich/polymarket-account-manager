[project]
name = "polymarket-account-manager"
version = "0.1.0"
description = "CLI tool for bulk-creating and managing Polymarket trading accounts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["polymarket", "trading", "ethereum", "polygon", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "py-clob-client-v2>=1.0.0",
    "web3>=7.0",
    "eth-account>=0.13",
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.34.1",
    "faker>=40.15.0",
    "python-dotenv>=1.2.2",
    "pysocks>=1.7.1",
    "socksio>=1.0.0",
    "browserforge>=1.2",
]

[project.scripts]
pam = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
